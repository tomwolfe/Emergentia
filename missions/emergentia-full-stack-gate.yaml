mission:
  name: emergentia-full-stack-gate
  goal: |
    Full-stack gate: commands + no-zai artifacts + probes (spring R2>0.9 shape check) + mutation>=0.8 + clean room + review. No network, no new deps.
tasks:
  - This is a VERIFY-ONLY gate: the payload is implemented. Run the verification suite; if every gate passes on the committed tree, make NO changes and leave the tree clean.
  - Change code only to fix a genuinely failing gate, minimally, without deleting production logic to satisfy mutants.
context:
  - "F(r) = -dV/dr identities hold for Harmonic, LennardJones, Morse, Gravity, Buckingham, Yukawa."
  - "ConservativeForceField.forward matches analytical grad via autograd."
  - "reduced_units defaults False."
  - "A test-only patch that raises the source-mutant kill rate is substantive hardening, not a vacuous change; judge it by the kill rate and gate evidence."
  - "EXPECTED OUTCOME: empty change with all gates green (commands incl. SPRING_R2>0.9 and NETWORK_LEAKAGE_SCAN CLEAN, probes, artifacts, clean room, mutation kill_rate>=0.8). Approve an empty change when the evidence is substantive."
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
  - Never edit outside allowed_paths; sandbox enforce.
  - Do NOT delete or bypass production logic to satisfy mutants; close gaps with tests or genuine fixes.
verification:
  commands:
    - python -m pytest tests/test_no_zai_leakage.py tests/test_physics_priors.py tests/test_registry_consistency.py tests/test_unit_checker.py tests/test_conservative_grad.py -v
    - python3 -c "import sympy as sp; from emergentia.simulator import HarmonicPotential; from emergentia.utils import verify_equivalence; ok, m = verify_equivalence(-10*(sp.Symbol('r')-1), 'spring', potential=HarmonicPotential()); print('SPRING_R2:', m.get('r2'), 'SUCCESS:', ok); assert ok and m.get('r2', 0) > 0.9"
    - python3 -c "import pathlib, re; pats = ['zai', 'glm-4', 'ZAI_API', 'socket', 'requests', 'urllib', 'http.client', 'xmlrpc']; bad = [(str(p), i, l.strip()) for p in list(pathlib.Path('emergentia').rglob('*.py')) + [pathlib.Path('run_benchmarks.py')] for i, l in enumerate(p.read_text().splitlines(), 1) for pat in pats if re.search(pat, l, re.I)]; print('NETWORK_LEAKAGE_SCAN:', 'CLEAN' if not bad else bad); assert not bad"
  probes:
    - command: 'python3 -c "from emergentia.physics_priors import PhysicsPriorProvider; print(len(PhysicsPriorProvider().generate_priors(''spring'')))"'
      contains: "5"
    - command: 'python3 -c "import sympy as sp; from emergentia.simulator import HarmonicPotential; from emergentia.utils import verify_equivalence; ok, m = verify_equivalence(-10*(sp.Symbol(''r'')-1), ''spring'', potential=HarmonicPotential()); print(''spring analytic R2:'', m.get(''r2''), ''success:'', ok)"'
      contains: "spring analytic R2: 0.99"
    - command: "grep -R -icE 'zai' emergentia/ run_benchmarks.py README.md 2>/dev/null || echo NO_LEAKAGE"
      contains: "NO_LEAKAGE"
  artifacts:
    - "emergentia/physics_priors.py"
    - "emergentia/engine.py"
  assertions:
    - path: "emergentia/physics_priors.py"
      contains: "PhysicsPriorProvider"
  clean_room: true
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 6
    baseline_targets:
      - emergentia/physics_priors.py
      - emergentia/unit_checker.py
      - emergentia/simulator.py
      - emergentia/registry.py
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

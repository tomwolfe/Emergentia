mission:
  name: emergentia-full-stack-gate
  goal: |
    Full-stack gate: commands + no-zai artifacts + probes (spring R2>0.9 shape check) + mutation>=0.8 + clean room + review. No network, no new deps.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
context:
  - "F(r) = -dV/dr identities hold for Harmonic, LennardJones, Morse, Gravity, Buckingham, Yukawa."
  - "ConservativeForceField.forward matches analytical grad via autograd."
  - "reduced_units defaults False."
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
  - Never edit outside allowed_paths; sandbox enforce.
verification:
  commands:
    - python -m pytest tests/test_no_zai_leakage.py tests/test_physics_priors.py tests/test_registry_consistency.py tests/test_unit_checker.py tests/test_conservative_grad.py -vcker.py -v
  probes:
    - command: 'python3 -c "from emergentia.physics_priors import PhysicsPriorProvider; print(len(PhysicsPriorProvider().generate_priors(''spring'')))"'
      contains: "5"
    - command: 'python3 -c "import sympy as sp; from emergentia.simulator import HarmonicPotential; from emergentia.utils import verify_equivalence; ok, m = verify_equivalence(-10*(sp.Symbol(''r'')-1), ''spring'', potential=HarmonicPotential()); print(''spring analytic R2:'', m.get(''r2''), ''success:'', ok)"'
      contains: "spring analytic R2: 0.99"
  artifacts:
    - "emergentia/physics_priors.py"
    - "emergentia/engine.py"
  assertions:
    - path: "emergentia/physics_priors.py"
      contains: "PhysicsPriorProvider"
  probes:
    - command: "grep -R -icE 'zai' emergentia/ run_benchmarks.py README.md 2>/dev/null || echo NO_LEAKAGE"
      contains: "NO_LEAKAGE"
  clean_room: true
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 30
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

mission:
  name: emergentia-00-toolchain-consistency
  goal: |
    Pin the Emergentia toolchain: python, pytest, torch, sympy versions consistent across runs.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
context:
  - "Toolchain check only; no behavior change."
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py tests/test_registry_consistency.py -v
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
forbidden_paths:
  - ".git/**"
  - ".tether/**"

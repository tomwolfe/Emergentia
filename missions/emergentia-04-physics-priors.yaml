mission:
  name: emergentia-04-physics-priors
  goal: |
    PhysicsPriorProvider is pure local: get_mode_priors and generate_priors use only sympy/registry, no network.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py -v
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

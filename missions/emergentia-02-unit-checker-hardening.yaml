mission:
  name: emergentia-02-unit-checker-hardening
  goal: |
    Harden UnitChecker: reduced_units defaults False; inconsistent Add returns NaN signature and fails closed.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
context:
  - "UnitChecker check_consistency returns NAN sig on inconsistent Add."
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py tests/test_registry_consistency.py -v
  probes:
    - command: 'python3 -c "import sympy as sp; from emergentia.unit_checker import UnitChecker; c=UnitChecker(mode=''gravity''); print(c.check_consistency(sp.Symbol(''r'')+sp.Symbol(''G''))[0])"'
      contains: "False"
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

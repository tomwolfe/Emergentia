mission:
  name: emergentia-05-cleanroom-integrity
  goal: |
    Prove Emergentia works in isolation via clean-room run of the test subset.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py tests/test_registry_consistency.py -v
  probes:
    # Gravity ships 8 priors (pinned by test_prior_counts_exact_per_mode);
    # an earlier revision of this probe expected 4 and could only pass by
    # weakening the priors, which the reviewer correctly rejected as gaming.
    - command: 'python3 -c "from emergentia.physics_priors import PhysicsPriorProvider; print(len(PhysicsPriorProvider().generate_priors(''gravity'')))"'
      contains: "8"
  clean_room: true
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

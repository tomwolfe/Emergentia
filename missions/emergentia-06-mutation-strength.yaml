mission:
  name: emergentia-06-mutation-strength
  goal: |
    Mutation gate: test suite must kill >=80% of mutants in physics_priors and unit_checker.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py tests/test_registry_consistency.py -v
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 30
    # Targets named by the mission goal (physics_priors and unit_checker);
    # without them a no-change run measures 0/0 mutants and can never pass.
    # (Added 2026-11-04 after a 0/0 vacuous failure.)
    baseline_targets:
      - emergentia/physics_priors.py
      - emergentia/unit_checker.py
    # physics_priors.py:115:12 [break_return]: `return None` rewritten to
    # `return None` -- byte-identical source, no test can distinguish it
    # (same documented equivalent as the 09 gate).
    equivalent:
      - "emergentia/physics_priors.py:115:12"
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"

mission:
  name: emergentia-01-no-zai-gate
  goal: |
    Prove zero ZAI/LLM-network leakage: no zai, glm, ZAI_API references anywhere in committed code.
tasks:
  - Verify committed behavior; fix minimally only if verification fails.
context:
  - "Run grep to confirm zero leakage."
  - "emergentia/physics_priors.py is pure local."
constraints:
  - Do not add new dependencies or network calls.
  - Keep existing tests green.
verification:
  commands:
    - python -m pytest tests/test_physics_priors.py tests/test_registry_consistency.py -v
  artifacts:
    - "emergentia/physics_priors.py"
    - "emergentia/engine.py"
  assertions:
    - path: "emergentia/physics_priors.py"
      contains: "PhysicsPriorProvider"
  probes:
    - command: "grep -R -icE 'zai' emergentia/ run_benchmarks.py README.md 2>/dev/null || echo NO_LEAKAGE"
      contains: "NO_LEAKAGE"
recovery:
  max_attempts: 3
review:
  enabled: true
  adapter: opencode
budget:
  max_sends: 24
  max_wall_seconds: 5400
adapter: opencode
adapters:
  opencode:
    command: ["python3", "../tether/scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
git_state_guard: true
allowed_paths:
  - emergentia/**
  - tests/**
  - run_benchmarks.py
  - README.md
forbidden_paths:
  - ".git/**"
  - ".tether/**"
